[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prectg"
version = "0.1.0"
description = "분만 전 EMR과 초기 CTG 정보를 단계적으로 결합하는 기능 시연용 MVP"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
prectg = "prectg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = ["tools"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
